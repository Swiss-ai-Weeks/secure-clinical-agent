# Patient360 inference + stores on two H100 NVLs.
# GPU 1: Nano (and VISTA with --profile ingest). GPU 0: safety + embed (and MedGemma with ingest).
# Host publishes loopback only. NGC_API_KEY must come from the environment, never this file.

name: patient360

services:
  postgres:
    image: public.ecr.aws/docker/library/postgres:16-bookworm
    container_name: patient360-postgres
    restart: unless-stopped
    environment:
      # fhir_app is the superuser owner: initdb and operators only. Services connect
      # as the p360_* roles below, whose passwords 99-role-passwords.sh applies once.
      POSTGRES_USER: fhir_app
      POSTGRES_PASSWORD: ${PATIENT360_FHIR_PASSWORD:-patient360-fhir-dev}
      POSTGRES_DB: fhir
      PATIENT360_APP_PASSWORD: ${PATIENT360_APP_PASSWORD:-patient360-app-dev}
      PATIENT360_WORKER_PASSWORD: ${PATIENT360_WORKER_PASSWORD:-patient360-worker-dev}
      PATIENT360_AUDITOR_PASSWORD: ${PATIENT360_AUDITOR_PASSWORD:-patient360-auditor-dev}
      # 98-openfga-datastore.sh: separate database + role for the OpenFGA datastore.
      PATIENT360_OPENFGA_DB_PASSWORD: ${PATIENT360_OPENFGA_DB_PASSWORD:-patient360-openfga-db-dev}
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - postgres-fhir-data:/var/lib/postgresql/data
      # Runs only on an empty volume. After a schema change: docker volume rm patient360_postgres-fhir-data
      - ./sql/fhir:/docker-entrypoint-initdb.d:ro
    healthcheck:
      # Probe over TCP on purpose: during initdb the entrypoint runs a temporary server
      # on the Unix socket only, and a socket probe passes while the init scripts are
      # still running. openfga-migrate must not see "healthy" before the openfga
      # database exists.
      test: ["CMD-SHELL", "pg_isready -h 127.0.0.1 -U fhir_app -d fhir"]
      interval: 5s
      timeout: 3s
      retries: 20
    networks: [patient360]

  openfga-migrate:
    # One-shot: creates OpenFGA's tables in the `openfga` database. Runs before `openfga`.
    image: openfga/openfga:v1.8.12
    container_name: patient360-openfga-migrate
    command: ["migrate"]
    environment:
      OPENFGA_DATASTORE_ENGINE: postgres
      OPENFGA_DATASTORE_URI: postgres://openfga:${PATIENT360_OPENFGA_DB_PASSWORD:-patient360-openfga-db-dev}@postgres:5432/openfga?sslmode=disable
    depends_on:
      postgres:
        condition: service_healthy
    networks: [patient360]
    restart: "no"

  openfga:
    image: openfga/openfga:v1.8.12
    container_name: patient360-openfga
    restart: unless-stopped
    command: ["run"]
    environment:
      OPENFGA_DATASTORE_ENGINE: postgres
      OPENFGA_DATASTORE_URI: postgres://openfga:${PATIENT360_OPENFGA_DB_PASSWORD:-patient360-openfga-db-dev}@postgres:5432/openfga?sslmode=disable
      OPENFGA_PLAYGROUND_ENABLED: "false"
      OPENFGA_HTTP_ADDR: 0.0.0.0:8080
      OPENFGA_GRPC_ADDR: 0.0.0.0:8081
      OPENFGA_AUTHN_METHOD: preshared
      OPENFGA_AUTHN_PRESHARED_KEYS: ${PATIENT360_OPENFGA_KEY:-patient360-openfga-dev}
      # Off (the default) and stated: a revoked consent must fail the very next check
      # (Build Plan §9 step 11). Do not enable without re-testing live revocation.
      OPENFGA_CHECK_QUERY_CACHE_ENABLED: "false"
    ports:
      - "127.0.0.1:8091:8080"
    depends_on:
      openfga-migrate:
        condition: service_completed_successfully
    healthcheck:
      # The image is distroless; grpc_health_probe is the only probe it ships.
      test: ["CMD", "/usr/local/bin/grpc_health_probe", "-addr=127.0.0.1:8081"]
      interval: 5s
      timeout: 5s
      retries: 20
    networks: [patient360]

  openfga-init:
    # Loads stores/openfga/store.fga.yaml (model + demo tuples) into the store named
    # patient360-grants, creating it on first run. Safe to re-run: same store, duplicate
    # tuples ignored, one new immutable model version per run. The official openfga/cli
    # image is distroless, so the binary is copied into Alpine to get a shell and jq.
    build:
      context: ./stores/init
      dockerfile: openfga-cli.Dockerfile
    image: patient360/openfga-init:local
    container_name: patient360-openfga-init
    depends_on:
      openfga:
        condition: service_healthy
    environment:
      FGA_API_URL: http://openfga:8080
      FGA_API_TOKEN: ${PATIENT360_OPENFGA_KEY:-patient360-openfga-dev}
      OPENFGA_STORE_NAME: patient360-grants
      OPENFGA_STORE_FILE: /openfga/store.fga.yaml
    volumes:
      - ./stores/openfga:/openfga:ro
      - ./stores/init/openfga.sh:/init.sh:ro
    entrypoint: ["/bin/sh", "/init.sh"]
    networks: [patient360]
    restart: "no"

  backend:
    # Policy spine (Build Plan §4-5): sessions, PDP, run tokens, /tools/*, audit writer.
    # Connects to Postgres as p360_app, to OpenFGA with the preshared key, and to the
    # linkage vault over the separate patient360-linkage network. Source: backend/app.
    build:
      context: ../../app
    image: patient360/backend:local
    container_name: patient360-backend
    restart: unless-stopped
    environment:
      PATIENT360_DB_DSN: postgres://p360_app:${PATIENT360_APP_PASSWORD:-patient360-app-dev}@postgres:5432/fhir
      PATIENT360_OPENFGA_URL: http://openfga:8080
      PATIENT360_OPENFGA_KEY: ${PATIENT360_OPENFGA_KEY:-patient360-openfga-dev}
      PATIENT360_OPENFGA_STORE_NAME: patient360-grants
      PATIENT360_LINKAGE_URL: http://openbao:8200
      # The read-only backend token from openbao-init, never the root token.
      PATIENT360_LINKAGE_TOKEN: ${PATIENT360_LINKAGE_BACKEND_TOKEN:-patient360-linkage-backend-dev}
      PATIENT360_RUN_TOKEN_SECRET: ${PATIENT360_RUN_TOKEN_SECRET:-patient360-run-token-dev}
      PATIENT360_BREAK_GLASS_MINUTES: ${PATIENT360_BREAK_GLASS_MINUTES:-60}
      # Minors: caregiver-role readers see R/V rows redacted between these ages.
      PATIENT360_ADOLESCENT_AGE: ${PATIENT360_ADOLESCENT_AGE:-14}
      PATIENT360_MAJORITY_AGE: ${PATIENT360_MAJORITY_AGE:-18}
      PATIENT360_K_MIN: ${PATIENT360_K_MIN:-5}
      PATIENT360_K_MIN_CMS: ${PATIENT360_K_MIN_CMS:-false}
      PATIENT360_QDRANT_URL: http://qdrant:6333
      PATIENT360_QDRANT_API_KEY: ${PATIENT360_QDRANT_API_KEY:-change-me-qdrant}
      PATIENT360_EMBED_URL: http://embed:8000
      PATIENT360_NANO_URL: http://nano:8000
      PATIENT360_SAFETY_URL: http://safety:8000
      PATIENT360_MINIO_URL: http://minio:9000
      PATIENT360_MINIO_ACCESS_KEY: ${PATIENT360_MINIO_USER:-patient360}
      PATIENT360_MINIO_SECRET_KEY: ${PATIENT360_MINIO_PASSWORD:-change-me-minio}
      PATIENT360_AGENT_RUNTIME: ${PATIENT360_AGENT_RUNTIME:-inproc}
      # DEV=true enables /docs and POST /dev/run-token (mint a run token for the current
      # session, so the agent channel can be exercised before /chat exists).
      PATIENT360_DEV: ${PATIENT360_DEV:-false}
      # Loopback HTTP in the lab cannot set a Secure cookie; keep true behind TLS.
      PATIENT360_COOKIE_SECURE: ${PATIENT360_COOKIE_SECURE:-true}
    ports:
      - "127.0.0.1:8080:8080"
    depends_on:
      postgres:
        condition: service_healthy
      openfga:
        condition: service_healthy
      openfga-init:
        condition: service_completed_successfully
      openbao-init:
        condition: service_completed_successfully
    networks: [patient360, patient360-linkage]

  immudb:
    # Retired: audit_events lives in Postgres (schema audit, hash-chained, append-only).
    # Kept under a profile so nothing starts it by default.
    profiles: [legacy]
    image: codenotary/immudb:1.9.5
    container_name: patient360-immudb
    restart: unless-stopped
    environment:
      IMMUDB_ADDRESS: 0.0.0.0
      IMMUDB_ADMIN_PASSWORD: ${PATIENT360_AUDIT_PASSWORD:-patient360-audit-dev}
    ports:
      - "127.0.0.1:3322:3322"
    volumes:
      - immudb-data:/var/lib/immudb
    healthcheck:
      test: ["CMD", "immuadmin", "status"]
      interval: 10s
      timeout: 5s
      retries: 20
      start_period: 15s
    networks: [patient360]

  qdrant:
    image: qdrant/qdrant:v1.13.6
    container_name: patient360-qdrant
    restart: unless-stopped
    environment:
      QDRANT__SERVICE__API_KEY: ${PATIENT360_QDRANT_API_KEY:-patient360-qdrant-dev}
    ports:
      - "127.0.0.1:6333:6333"
    volumes:
      - qdrant-data:/qdrant/storage
    healthcheck:
      test: ["CMD-SHELL", "true"]
      interval: 10s
      timeout: 3s
      retries: 10
    networks: [patient360]

  qdrant-init:
    image: curlimages/curl:8.13.0
    container_name: patient360-qdrant-init
    depends_on:
      - qdrant
    environment:
      QDRANT__SERVICE__API_KEY: ${PATIENT360_QDRANT_API_KEY:-patient360-qdrant-dev}
    volumes:
      - ./stores/init/qdrant.sh:/init.sh:ro
    entrypoint: ["/bin/sh", "/init.sh"]
    networks: [patient360]
    restart: "no"

  openbao:
    image: ghcr.io/openbao/openbao:2.3.1
    container_name: patient360-openbao
    restart: unless-stopped
    command:
      - server
      - -dev
      - -dev-listen-address=0.0.0.0:8200
      - -dev-root-token-id=${PATIENT360_LINKAGE_TOKEN:-patient360-linkage-dev}
    environment:
      BAO_DEV_ROOT_TOKEN_ID: ${PATIENT360_LINKAGE_TOKEN:-patient360-linkage-dev}
    ports:
      - "127.0.0.1:8200:8200"
    networks: [patient360-linkage]

  openbao-init:
    # Writes the p360-backend (read self/*, identity/*) and p360-worker (write linkage/*)
    # policies and creates the two fixed-id tokens with the root token, which stays here.
    # Re-runs on every `up`; dev-mode OpenBao forgets everything on restart.
    image: ghcr.io/openbao/openbao:2.3.1
    container_name: patient360-openbao-init
    depends_on:
      - openbao
    environment:
      BAO_ADDR: http://openbao:8200
      BAO_TOKEN: ${PATIENT360_LINKAGE_TOKEN:-patient360-linkage-dev}
      PATIENT360_LINKAGE_MOUNT: secret
      PATIENT360_LINKAGE_BACKEND_TOKEN: ${PATIENT360_LINKAGE_BACKEND_TOKEN:-patient360-linkage-backend-dev}
      PATIENT360_LINKAGE_WORKER_TOKEN: ${PATIENT360_LINKAGE_WORKER_TOKEN:-patient360-linkage-worker-dev}
    volumes:
      - ./stores/init/openbao.sh:/init.sh:ro
    entrypoint: ["/bin/sh", "/init.sh"]
    networks: [patient360-linkage]
    restart: "no"

  minio:
    image: quay.io/minio/minio:latest
    container_name: patient360-minio
    restart: unless-stopped
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${PATIENT360_MINIO_USER}
      MINIO_ROOT_PASSWORD: ${PATIENT360_MINIO_PASSWORD}
    ports:
      - "127.0.0.1:9000:9000"
      - "127.0.0.1:9001:9001"
    volumes:
      - minio-data:/data
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 5s
      timeout: 5s
      retries: 20
    networks: [patient360]

  minio-init:
    image: quay.io/minio/mc:latest
    container_name: patient360-minio-init
    depends_on:
      minio:
        condition: service_healthy
    entrypoint:
      - /bin/sh
      - -c
      - |
        mc alias set local http://minio:9000 "$$MINIO_ROOT_USER" "$$MINIO_ROOT_PASSWORD"
        mc mb -p local/reports
        mc mb -p local/vlm-descriptions
        mc mb -p local/quarantine
    environment:
      MINIO_ROOT_USER: ${PATIENT360_MINIO_USER}
      MINIO_ROOT_PASSWORD: ${PATIENT360_MINIO_PASSWORD}
    networks: [patient360]
    restart: "no"

  orthanc:
    image: jodogne/orthanc-plugins:1.12.7
    container_name: patient360-orthanc
    restart: unless-stopped
    environment:
      ORTHANC__NAME: Patient360
      ORTHANC__AUTHENTICATION_ENABLED: "true"
      ORTHANC__REGISTERED_USERS: "${ORTHANC_USERS_JSON}"
      DICOM_WEB_PLUGIN_ENABLED: "true"
      VERBOSE_ENABLED: "false"
    ports:
      - "127.0.0.1:8042:8042"
      - "127.0.0.1:4242:4242"
    volumes:
      - orthanc-data:/var/lib/orthanc/db
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://127.0.0.1:8042/system >/dev/null || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 20
      start_period: 20s
    networks: [patient360]

  nano:
    image: nvcr.io/nim/nvidia/nemotron-3-nano:latest
    container_name: patient360-nano
    restart: unless-stopped
    user: "${UID:-1000}:${GID:-1000}"
    ipc: host
    shm_size: "16gb"
    environment:
      NGC_API_KEY: ${NGC_API_KEY}
      NIM_MAX_MODEL_LEN: "32768"
      NIM_GPU_MEMORY_UTILIZATION: "0.42"
      NIM_TENSOR_PARALLEL_SIZE: "1"
      HOME: /tmp
      USER: ${USER:-nvidia}
    volumes:
      - ${HOME}/.cache/nim/nano:/opt/nim/.cache
    ports:
      - "127.0.0.1:8000:8000"
    gpus:
      - driver: nvidia
        device_ids: ["1"]
        capabilities: [gpu]
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://127.0.0.1:8000/v1/health/ready >/dev/null || curl -fsS http://127.0.0.1:8000/v1/models >/dev/null"]
      interval: 20s
      timeout: 10s
      retries: 90
      start_period: 900s
    networks: [patient360]

  safety:
    image: nvcr.io/nim/nvidia/llama-3.1-nemotron-safety-guard-8b-v3:1.14.0
    container_name: patient360-safety
    restart: unless-stopped
    user: "${UID:-1000}:${GID:-1000}"
    ipc: host
    shm_size: "16gb"
    environment:
      NGC_API_KEY: ${NGC_API_KEY}
      NIM_TENSOR_PARALLEL_SIZE: "1"
      HOME: /tmp
      USER: ${USER:-nvidia}
    volumes:
      - ${HOME}/.cache/nim/safetyguard8b:/opt/nim/.cache
    ports:
      - "127.0.0.1:8002:8000"
    gpus:
      - driver: nvidia
        device_ids: ["0"]
        capabilities: [gpu]
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://127.0.0.1:8000/v1/health/ready >/dev/null || curl -fsS http://127.0.0.1:8000/v1/models >/dev/null"]
      interval: 20s
      timeout: 10s
      retries: 90
      start_period: 900s
    networks: [patient360]

  embed:
    image: nvcr.io/nim/nvidia/llama-nemotron-embed-vl-1b-v2:latest
    container_name: patient360-embed
    restart: unless-stopped
    user: "${UID:-1000}:${GID:-1000}"
    ipc: host
    shm_size: "16gb"
    environment:
      NGC_API_KEY: ${NGC_API_KEY}
      HOME: /tmp
      USER: ${USER:-nvidia}
    volumes:
      - ${HOME}/.cache/nim/embed:/opt/nim/.cache
    ports:
      - "127.0.0.1:8001:8000"
    gpus:
      - driver: nvidia
        device_ids: ["0"]
        capabilities: [gpu]
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://127.0.0.1:8000/v1/health/ready >/dev/null || curl -fsS http://127.0.0.1:8000/v1/models >/dev/null"]
      interval: 20s
      timeout: 10s
      retries: 90
      start_period: 600s
    networks: [patient360]

  vista3d:
    profiles: [ingest]
    image: nvcr.io/nim/nvidia/vista3d:1.0.0
    container_name: patient360-vista3d
    restart: unless-stopped
    user: "${UID:-1000}:${GID:-1000}"
    ipc: host
    shm_size: "16gb"
    environment:
      NGC_API_KEY: ${NGC_API_KEY}
      NIM_TENSOR_PARALLEL_SIZE: "1"
      HOME: /tmp
      USER: ${USER:-nvidia}
    volumes:
      - ${HOME}/.cache/nim/vista3d:/opt/nim/.cache
    ports:
      - "127.0.0.1:8003:8000"
    gpus:
      - driver: nvidia
        device_ids: ["1"]
        capabilities: [gpu]
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://127.0.0.1:8000/v1/health/ready >/dev/null || curl -fsS http://127.0.0.1:8000/v1/models >/dev/null"]
      interval: 20s
      timeout: 10s
      retries: 90
      start_period: 900s
    networks: [patient360]

  medgemma:
    profiles: [ingest]
    image: vllm/vllm-openai:v0.10.2
    container_name: patient360-medgemma
    restart: unless-stopped
    command:
      - google/medgemma-1.5-4b-it
      - --host
      - 0.0.0.0
      - --port
      - "8000"
      - --max-model-len
      - "8192"
      - --gpu-memory-utilization
      - "0.12"
      - --served-model-name
      - google/medgemma-1.5-4b-it
      - --enforce-eager
    environment:
      HUGGING_FACE_HUB_TOKEN: ${HF_TOKEN:-}
      HF_HOME: /root/.cache/huggingface
    volumes:
      - ${HOME}/.cache/huggingface:/root/.cache/huggingface
    ports:
      - "127.0.0.1:8004:8000"
    ipc: host
    shm_size: "8gb"
    gpus:
      - driver: nvidia
        device_ids: ["0"]
        capabilities: [gpu]
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://127.0.0.1:8000/v1/models >/dev/null"]
      interval: 20s
      timeout: 10s
      retries: 90
      start_period: 600s
    networks: [patient360]

volumes:
  postgres-fhir-data:
  immudb-data:
  qdrant-data:
  minio-data:
  orthanc-data:

networks:
  patient360:
    name: patient360
    driver: bridge
  patient360-linkage:
    name: patient360-linkage
    driver: bridge
