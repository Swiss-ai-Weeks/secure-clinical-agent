# Priya Nair, researcher on the 2026 cohort project. No patient tuples.
- user: user:u_nair
  relation: researcher
  object: project:cohort_2026
  condition:
    name: active_window
    context: { start: "2026-01-01T00:00:00Z", expiry: "2027-01-01T00:00:00Z" }

# Nina Haller, legal guardian of p_104 (Lea, born 2012-05-03). Registration write, not a
# consent: the worker records it from the guardianship proof; expiry is Lea's 18th birthday,
# so access lapses at majority without anyone acting. seed_demo.py records the matching
# consent_granted row (kind = guardianship). Adolescent-clinic rows are a PDP label rule.
- user: user:u_haller
  relation: guardian
  object: patient:p_104
  condition:
    name: active_window
    context: { start: "2026-01-01T00:00:00Z", expiry: "2030-05-03T00:00:00Z" }

# Tomas Lindqvist, dietary staff on ward w_3b. Placeholder shift window; seed_grants.py
# rewrites it to the demo shift. Reaches p_101 only through the ward chain below.
- user: user:u_lindqvist
  relation: staff
  object: ward:w_3b
  condition:
    name: active_window
    context: { start: "2026-09-15T00:00:00Z", expiry: "2026-09-25T00:00:00Z" }

# p_101 is admitted to ward w_3b (matches clinical.diet_orders.ward). Expiry is the
# expected discharge; the worker refreshes it and deletes the tuple on discharge.
- user: ward:w_3b
  relation: admitted_to
  object: patient:p_101
  condition:
    name: active_window
    context: { start: "2026-09-10T00:00:00Z", expiry: "2026-10-10T00:00:00Z" }
