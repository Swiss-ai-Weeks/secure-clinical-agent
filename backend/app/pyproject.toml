[project]
name = "patient360-backend"
version = "0.1.0"
description = "Patient360 policy spine: sessions, PDP, run tokens, read-only tools, audit."
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
  "fastapi>=0.115",
  "uvicorn[standard]>=0.30",
  "psycopg[binary,pool]>=3.2",
  "httpx>=0.27",
  "PyJWT>=2.9",
  "pydantic>=2.8",
  "pydantic-settings>=2.4",
  "python-multipart>=0.0.9",
  "nemoguardrails>=0.17",
  "pypdf>=5",
  "numpy>=2.0",
  "nibabel>=5.2",
  "pydicom>=2.4",
  "highdicom>=0.23",
]

[project.optional-dependencies]
deid = [
  "presidio-analyzer==2.2.358",
  "presidio-anonymizer==2.2.358",
]
chat = [
  "httpx>=0.27",
]

[dependency-groups]
dev = [
  "pytest>=8",
  "pytest-asyncio>=0.24",
  "ruff>=0.6",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["patient360"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
markers = [
  "integration: needs live Postgres and OpenFGA (set PATIENT360_DB_DSN)",
]

[tool.ruff]
line-length = 110
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
